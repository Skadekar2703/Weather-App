<body class="flex flex-col text-on-surface dark:text-white">
<!-- TopAppBar -->
<header class="fixed top-0 w-full h-16 z-50 flex justify-between items-center px-margin-mobile backdrop-blur-xl border-b border-white/15 bg-transparent">
<div class="flex items-center gap-stack-md">
<span class="material-symbols-outlined text-on-surface dark:text-white" data-icon="location_on">location_on</span>
<span class="font-title-md text-title-md font-bold text-on-surface dark:text-white">SkyCast</span>
</div>
<button class="p-2 hover:bg-white/10 transition-colors rounded-full active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined text-on-surface dark:text-white" data-icon="search">search</span>
</button>
</header>
<!-- Main Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-margin-mobile py-24 text-center">
<!-- Visual Anchor: Location Denied Graphic -->
<div class="relative mb-stack-lg">
<div class="absolute inset-0 bg-primary/20 blur-3xl rounded-full scale-150"></div>
<div class="glass-card w-24 h-24 rounded-full flex items-center justify-center relative z-10 border-white/10 shadow-2xl">
<span class="material-symbols-outlined text-5xl text-primary-fixed-dim" data-icon="location_off" style="font-variation-settings: 'wght' 200">location_off</span>
</div>
</div>
<!-- Typography Cluster -->
<div class="max-w-xs space-y-stack-md mb-12">
<h1 class="font-title-md text-[20px] font-medium leading-relaxed tracking-tight text-white">
                Where are you?
            </h1>
<p class="font-body-md text-body-md text-on-secondary-fixed-variant leading-6">
                We couldn't access your location. Search for a city manually to see the weather.
            </p>
</div>
<!-- Action Cluster -->
<div class="w-full max-w-sm flex flex-col gap-4">
<button class="bg-primary-container text-on-primary-container font-title-md text-title-md py-4 rounded-xl shadow-lg active:scale-95 transition-all duration-200 hover:brightness-110">
                Search City
            </button>
<a class="font-label-sm text-label-sm text-primary-fixed-dim py-2 hover:bg-white/5 transition-all rounded-lg inline-flex items-center justify-center gap-2" href="#">
<span class="material-symbols-outlined text-sm" data-icon="settings">settings</span>
                Open Settings
            </a>
</div>
<!-- Contextual Visual Hint (Bento-style background detail) -->
<div class="mt-16 w-full max-w-md grid grid-cols-2 gap-gutter opacity-40">
<div class="glass-card h-24 rounded-2xl flex items-center justify-center border-white/5">
<div class="flex flex-col items-center gap-1">
<span class="material-symbols-outlined text-white/50" data-icon="cloud_queue">cloud_queue</span>
<div class="h-1.5 w-12 bg-white/10 rounded-full"></div>
</div>
</div>
<div class="glass-card h-24 rounded-2xl flex items-center justify-center border-white/5">
<div class="flex flex-col items-center gap-1">
<span class="material-symbols-outlined text-white/50" data-icon="thermostat">thermostat</span>
<div class="h-1.5 w-8 bg-white/10 rounded-full"></div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar (Suppressed as per rules: Task-focused empty state with back/close logic) -->
