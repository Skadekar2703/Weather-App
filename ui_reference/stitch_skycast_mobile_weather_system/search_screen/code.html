<body class="text-on-surface dark:text-on-surface">
<!-- Search Overlay Container -->
<main class="relative min-h-screen w-full flex flex-col pt-4">
<!-- Search Bar Section -->
<div class="px-margin-mobile mb-stack-lg">
<div class="flex items-center glass-panel rounded-full h-14 px-4 shadow-2xl ring-2 ring-primary/40">
<button class="p-2 mr-2 text-on-surface-variant hover:bg-white/10 rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<input autofocus="" class="bg-transparent border-none focus:ring-0 text-title-md font-body-md w-full placeholder-on-surface-variant/60 text-on-surface" placeholder="Search city..." type="text"/>
<div class="p-2 text-primary flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="search" data-weight="fill" style="font-variation-settings: 'FILL' 1;">search</span>
</div>
</div>
</div>
<!-- Content Area -->
<div class="flex-1 px-margin-mobile">
<!-- Section Header -->
<div class="flex items-center justify-between mb-stack-md">
<h2 class="font-title-md text-title-md text-on-surface opacity-90">Recent Searches</h2>
<button class="font-label-sm text-label-sm text-primary hover:underline">Clear all</button>
</div>
<!-- Suggestion/Recent List (Bento-lite style) -->
<div class="grid grid-cols-1 gap-gutter">
<!-- Location Item 1 -->
<div class="glass-panel p-stack-md rounded-xl flex items-center justify-between hover:bg-white/10 transition-all cursor-pointer group active:scale-[0.98]">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-primary-container/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="location_on">location_on</span>
</div>
<div>
<p class="font-title-md text-title-md">New York</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">United States</p>
</div>
</div>
<div class="text-right">
<p class="font-headline-lg-mobile text-headline-lg-mobile">12°</p>
<p class="font-label-sm text-label-sm text-primary">Rainy</p>
</div>
</div>
<!-- Location Item 2 -->
<div class="glass-panel p-stack-md rounded-xl flex items-center justify-between hover:bg-white/10 transition-all cursor-pointer group active:scale-[0.98]">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-primary-container/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="location_on">location_on</span>
</div>
<div>
<p class="font-title-md text-title-md">Tokyo</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">Japan</p>
</div>
</div>
<div class="text-right">
<p class="font-headline-lg-mobile text-headline-lg-mobile">18°</p>
<p class="font-label-sm text-label-sm text-tertiary-container">Clear</p>
</div>
</div>
<!-- Location Item 3 -->
<div class="glass-panel p-stack-md rounded-xl flex items-center justify-between hover:bg-white/10 transition-all cursor-pointer group active:scale-[0.98]">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-primary-container/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="location_on">location_on</span>
</div>
<div>
<p class="font-title-md text-title-md">Paris</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">France</p>
</div>
</div>
<div class="text-right">
<p class="font-headline-lg-mobile text-headline-lg-mobile">15°</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">Cloudy</p>
</div>
</div>
</div>
<!-- Popular Suggestions (Horizontal Chips) -->
<div class="mt-stack-lg">
<h2 class="font-title-md text-title-md text-on-surface opacity-90 mb-stack-md">Popular Cities</h2>
<div class="flex flex-wrap gap-stack-sm">
<span class="glass-panel px-4 py-2 rounded-full font-label-sm text-label-sm text-on-surface-variant hover:bg-white/20 transition-colors cursor-pointer">London</span>
<span class="glass-panel px-4 py-2 rounded-full font-label-sm text-label-sm text-on-surface-variant hover:bg-white/20 transition-colors cursor-pointer">Seoul</span>
<span class="glass-panel px-4 py-2 rounded-full font-label-sm text-label-sm text-on-surface-variant hover:bg-white/20 transition-colors cursor-pointer">Sydney</span>
