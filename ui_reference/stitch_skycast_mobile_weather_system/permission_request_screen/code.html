<!-- Top App Bar Content (Stateless Header for Splash/Onboarding) -->

<h1 class="font-title-md text-title-md font-bold text-white tracking-tight">SkyCast</h1>

<main class="w-full max-w-md flex flex-col items-center text-center">
<!-- Illustration Section -->
<div class="mb-stack-lg relative">
<div class="absolute inset-0 bg-primary-container/20 blur-3xl rounded-full scale-150"></div>
<div class="glass-card w-24 h-24 rounded-full flex items-center justify-center relative z-10">
<span class="material-symbols-outlined text-[48px] text-primary-fixed" data-icon="location_on">location_on</span>
</div>
<!-- Decorative atmospheric particles -->
<div class="absolute -top-4 -right-4 w-4 h-4 rounded-full bg-white/20 blur-sm"></div>
<div class="absolute top-12 -left-8 w-2 h-2 rounded-full bg-primary-fixed/40 blur-none"></div>
</div>

<div class="space-y-stack-md mb-12">
<h2 class="font-title-md text-title-md text-white">Enable Location</h2>
<p class="font-body-md text-body-md text-on-surface-variant dark:text-secondary-fixed max-w-[280px] mx-auto">
                SkyCast needs your location to provide accurate local weather updates instantly.
            </p>
</div>
<!-- Action Section -->
<div class="w-full space-y-stack-md">
<!-- Primary Button: Allow Access -->
<button class="w-full h-12 bg-primary-container text-on-primary-container font-title-md text-title-md rounded-[24px] shadow-lg active:scale-95 transition-transform duration-150 flex items-center justify-center">
                Allow Access
            </button>
<!-- Secondary Button: Manual Entry -->
<button class="w-full h-12 bg-white/5 border border-white/10 text-white font-title-md text-title-md rounded-[24px] hover:bg-white/10 active:scale-95 transition-all duration-150 flex items-center justify-center">

            </button>
</div>
</main>
