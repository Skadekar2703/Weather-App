<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Roboto+Flex:opsz,wght@8..144,100..1000&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">

        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-error": "#ffffff",
                    "on-error-container": "#93000a",
                    "on-secondary": "#ffffff",

                    "primary": "#00658d",
                    "on-surface-variant": "#3e4850",
                    "surface-container-low": "#f6f3f2",
                    "inverse-on-surface": "#f3f0ef",
                    "background": "#fcf9f8",
                    "on-primary-fixed": "#001e2d",
                    "surface-variant": "#e5e2e1",
                    "inverse-primary": "#82cfff",
                    "surface-container-high": "#ebe7e7",
                    "on-background": "#1c1b1b",
                    "secondary-fixed": "#e2e2e2",
                    "tertiary-container": "#ea8c21",
                    "primary-fixed": "#c6e7ff",
                    "surface-dim": "#dcd9d9",
                    "error": "#ba1a1a",
                    "tertiary-fixed-dim": "#ffb876",
                    "inverse-surface": "#313030",
                    "outline": "#6e7881",
                    "secondary-container": "#dfe0e0",
                    "tertiary-fixed": "#ffdcc0",
                    "on-primary": "#ffffff",
                    "surface-container-highest": "#e5e2e1",
                    "on-tertiary": "#ffffff",
                    "error-container": "#ffdad6",

                    "surface": "#fcf9f8",

                    "secondary": "#5d5f5f",

                    "DEFAULT": "0.25rem",

            },
            "spacing": {
                    "margin-tablet": "48px",
                    "stack-lg": "32px",
                    "stack-sm": "8px",
                    "margin-mobile": "24px",
                    "stack-md": "16px",
                    "gutter": "16px"
            },
            "fontFamily": {
                    "title-md": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "label-sm": ["Inter"],
                    "display-xl": ["Inter"],
                    "body-md": ["Roboto Flex"],
                    "headline-lg": ["Inter"]
            },
            "fontSize": {
                    "title-md": ["18px", {"lineHeight": "24px", "fontWeight": "500"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "600"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],

        },
      }

<style>
        body {
            background: linear-gradient(180deg, #00aeef 0%, #82cfff 100%);
            min-height: 100vh;
            color: #ffffff;
        }
        .skeleton-pulse {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="dark font-body-md text-body-md overflow-x-hidden">
<!-- TopAppBar Shell -->
<header class="fixed top-0 left-0 w-full z-50 backdrop-blur-xl border-b border-white/15 bg-transparent flex justify-between items-center px-margin-mobile h-16">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-on-surface dark:text-on-surface">location_on</span>
<span class="font-title-md text-title-md font-bold text-on-surface dark:text-on-surface">SkyCast</span>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/10 transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined text-on-surface dark:text-on-surface">search</span>
</button>
</header>
<!-- Main Canvas -->
<main class="pt-24 pb-32 px-margin-mobile max-w-4xl mx-auto space-y-stack-lg">
<!-- Hero Temperature Skeleton -->
<section class="flex flex-col items-center justify-center py-stack-lg space-y-stack-md">
<div class="skeleton-pulse w-48 h-24 rounded-2xl"></div>
<div class="skeleton-pulse w-32 h-6 rounded-full"></div>
<div class="flex gap-stack-sm">
<div class="skeleton-pulse w-20 h-8 rounded-full"></div>
<div class="skeleton-pulse w-20 h-8 rounded-full"></div>
</div>
</section>
<!-- Hourly Forecast Horizontal List -->
<section class="space-y-stack-md">
<div class="skeleton-pulse w-32 h-6 rounded-full"></div>
<div class="flex gap-stack-md overflow-x-auto pb-2 scrollbar-hide">
<div class="skeleton-pulse flex-shrink-0 w-20 h-32 rounded-2xl"></div>
<div class="skeleton-pulse flex-shrink-0 w-20 h-32 rounded-2xl"></div>
<div class="skeleton-pulse flex-shrink-0 w-20 h-32 rounded-2xl"></div>
<div class="skeleton-pulse flex-shrink-0 w-20 h-32 rounded-2xl"></div>
<div class="skeleton-pulse flex-shrink-0 w-20 h-32 rounded-2xl"></div>
</div>
</section>
<!-- Detail Widgets Bento Grid -->
<section class="grid grid-cols-2 md:grid-cols-4 gap-gutter">
<div class="skeleton-pulse aspect-square rounded-2xl col-span-1"></div>
<div class="skeleton-pulse aspect-square rounded-2xl col-span-1"></div>
<div class="skeleton-pulse aspect-video md:aspect-square rounded-2xl col-span-2"></div>
<div class="skeleton-pulse aspect-square rounded-2xl col-span-1"></div>
<div class="skeleton-pulse aspect-square rounded-2xl col-span-1"></div>
<div class="skeleton-pulse aspect-square rounded-2xl col-span-1 md:hidden"></div>
<div class="skeleton-pulse aspect-square rounded-2xl col-span-1 md:hidden"></div>
</section>
<!-- Extended Forecast Block -->
<section class="skeleton-pulse w-full h-64 rounded-2xl"></section>
</main>
<!-- BottomNavBar Shell -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 py-3 pb-safe z-50 rounded-t-xl backdrop-blur-2xl border-t border-white/15 bg-surface/60 dark:bg-surface-container/60">
<a class="flex flex-col items-center justify-center bg-primary-container/30 text-on-primary-container rounded-full px-5 py-1 scale-90 transition-all duration-200" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">cloud_queue</span>
<span class="font-label-sm text-label-sm">Forecast</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-secondary-fixed-variant hover:bg-white/5 transition-all" href="#">
<span class="material-symbols-outlined">map</span>
<span class="font-label-sm text-label-sm">Locations</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-secondary-fixed-variant hover:bg-white/5 transition-all" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="font-label-sm text-label-sm">Settings</span>
</a>
</nav>
<!-- Background Decoration for Depth -->
<div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none">
<div class="absolute top-[20%] left-[-10%] w-[60%] h-[40%] bg-white/10 blur-[100px] rounded-full"></div>
<div class="absolute bottom-[10%] right-[-10%] w-[50%] h-[30%] bg-primary-container/20 blur-[120px] rounded-full"></div>
</div>
</body></html>
